# Perfil de desarrollo: apunta al MySQL local levantado con docker-compose.yml.
# Los defaults aqui solo existen para arrancar rapido en local; nunca se usan en produccion.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:marketplace_dev}?useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:marketplace}
    password: ${DB_PASSWORD:marketplace}
  jpa:
    show-sql: true

scraper:
  # Default fuera del repo a proposito, para minimizar riesgo de commit
  # accidental de la sesion de Facebook aunque ya este en .gitignore.
  session-file-path: ${SCRAPER_SESSION_FILE:${user.home}/.marketplace-scraper/facebook-session.json}

# Dashboard (HTTP Basic): con default solo en dev, para no exigir configurar
# credenciales al levantar la app localmente. Nunca tiene default en produccion
# (ver application-prod.yml).
dashboard:
  username: ${DASHBOARD_USERNAME:dev}
  password: ${DASHBOARD_PASSWORD:dev}

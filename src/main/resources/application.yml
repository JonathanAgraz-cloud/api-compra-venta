spring:
  application:
    name: api-compra-venta
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway es la unica fuente de verdad del schema. Hibernate solo valida
      # que las entidades coincidan con las tablas creadas por las migraciones.
      # Nunca cambiar a "update" o "create".
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

scraper:
  headless: ${SCRAPER_HEADLESS:true}
  delay-min-ms: ${SCRAPER_DELAY_MIN_MS:3000}
  delay-max-ms: ${SCRAPER_DELAY_MAX_MS:8000}
  base-location-query: ${SCRAPER_BASE_LOCATION:Mérida, Yucatán, México}
  max-results-per-search: ${SCRAPER_MAX_RESULTS_PER_SEARCH:20}

# Bot de Telegram para el modulo de alertas. Sin default a proposito para
# bot-token/chat-id (TelegramClient valida en el momento del envio) -- asi
# arrancar la app en local no exige tener un bot configurado.
telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  chat-id: ${TELEGRAM_CHAT_ID:}

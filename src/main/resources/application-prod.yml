# Perfil de produccion: RDS. Sin defaults en host/usuario/password a proposito -
# si falta configurar una variable de entorno en el EC2, la app debe fallar al
# arrancar en vez de arrancar con algo inseguro o apuntando al lugar equivocado.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=true&requireSSL=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false

scraper:
  session-file-path: ${SCRAPER_SESSION_FILE}

scheduler:
  enabled: ${SCHEDULER_ENABLED:true}

# Dashboard (HTTP Basic): sin default a proposito, igual que las demas
# credenciales -- debe fallar al arrancar si no se configuraron.
dashboard:
  username: ${DASHBOARD_USERNAME}
  password: ${DASHBOARD_PASSWORD}
